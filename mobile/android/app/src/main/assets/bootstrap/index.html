<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';base-uri 'none';form-action 'none'">
  <title>JCGO</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #1e293b; color: #17202d; }
    main { width: min(34rem, 100%); padding: 28px; border: 1px solid #d8d0c1; border-radius: 18px; background: #f7f2e5; box-shadow: 0 18px 50px rgb(0 0 0 / 0.22); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: #5b6470; line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #a9a18f; border-radius: 10px; background: #fffdf7; color: inherit; font: inherit; }
    input:focus { outline: 3px solid rgb(154 106 46 / 0.24); border-color: #9a6a2e; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px; background: #9a6a2e; color: #fff; font: inherit; font-weight: 700; }
    button.secondary { background: #ded6c8; color: #283241; }
    button:disabled { opacity: .55; }
    #error { min-height: 24px; margin-top: 14px; color: #a3352d; line-height: 1.4; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>连接 JCGO</h1>
    <p>请输入 JCGO 服务的 HTTPS 地址。服务端需要通过 Nginx 提供 HTTPS/WSS 入口。</p>
    <form id="form">
      <label for="base-url">服务地址</label>
      <input id="base-url" name="baseUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://jcgo.example.com" required>
      <div class="actions">
        <button id="save" type="submit">连接</button>
        <button id="retry" class="secondary" type="button" hidden>重试</button>
        <button id="reset" class="secondary" type="button" hidden>更换地址</button>
      </div>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('base-url');
    const save = document.getElementById('save');
    const retry = document.getElementById('retry');
    const reset = document.getElementById('reset');
    const error = document.getElementById('error');
    const pending = new Map();
    let sequence = 0;

    function requestId() {
      sequence += 1;
      return `jcgo-${Date.now().toString(36)}-${sequence.toString(36)}`;
    }

    function callBootstrap(action, payload = {}) {
      const bridge = window.jcgoBootstrap;
      if (typeof bridge?.postMessage !== 'function') {
        return Promise.reject(new Error('当前 Android WebView 不支持 Bootstrap 通信。'));
      }
      return new Promise((resolve, reject) => {
        const id = requestId();
        pending.set(id, { resolve, reject });
        try {
          bridge.postMessage(JSON.stringify({ requestId: id, action, payload }));
        } catch (requestError) {
          pending.delete(id);
          reject(requestError);
        }
      });
    }

    function render(state) {
      input.value = state.baseUrl || '';
      error.textContent = state.error || '';
      retry.hidden = !state.baseUrl || !state.error;
      reset.hidden = !state.baseUrl;
      save.disabled = Boolean(state.busy);
    }

    async function run(action, payload, button) {
      if (button) button.disabled = true;
      try { render(await callBootstrap(action, payload)); }
      catch (requestError) { error.textContent = requestError instanceof Error ? requestError.message : String(requestError); }
      finally { if (button) button.disabled = false; }
    }

    if (typeof window.jcgoBootstrap?.postMessage === 'function') {
      window.jcgoBootstrap.onmessage = event => {
        let response;
        try { response = JSON.parse(event.data); } catch (_) { return; }
        const request = pending.get(response.requestId);
        if (!request) return;
        pending.delete(response.requestId);
        response.ok ? request.resolve(response.result) : request.reject(new Error(response.error || 'Bootstrap 请求失败。'));
      };
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      void run('bootstrap.saveBaseUrl', { baseUrl: input.value }, save);
    });
    retry.addEventListener('click', () => void run('bootstrap.retry', {}, retry));
    reset.addEventListener('click', () => void run('bootstrap.reset', {}, reset));
    window.addEventListener('DOMContentLoaded', () => void run('bootstrap.getState', {}));
  </script>
</body>
</html>
